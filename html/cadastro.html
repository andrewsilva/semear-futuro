<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se como voluntário ou apoiador da Semear Futuro.">
  <title>Semear Futuro | Cadastro de voluntário</title>
</head>
<body>
  <header>
    <a href="index.html"><img src="../img/logo-semear-futuro.png" alt="Logotipo da ONG Semear Futuro" width="160" height="60"></a>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html" aria-current="page">Seja voluntário</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Cadastro de voluntário</h1>
    <p>Todos os campos são obrigatórios.</p>
    <form action="#" method="post">
      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" minlength="3" maxlength="100" pattern="[A-Za-zÀ-ÿ' ]+" title="Use apenas letras e espaços" autocomplete="name" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required>
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" min="1920-01-01" max="2008-12-31" title="O cadastro é para maiores de 18 anos" required>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" placeholder="000.000.000-00" title="Formato 000.000.000-00" required>
        <label for="telefone">Telefone celular</label>
        <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\) \d{5}-\d{4}" maxlength="15" placeholder="(00) 00000-0000" title="Formato (00) 00000-0000" autocomplete="tel" required>
      </fieldset>
      <fieldset>
        <legend>Endereço</legend>
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" inputmode="numeric" pattern="\d{5}-\d{3}" maxlength="9" placeholder="00000-000" title="Formato 00000-000" autocomplete="postal-code" required>
        <label for="endereco">Endereço e número</label>
        <input type="text" id="endereco" name="endereco" autocomplete="address-line1" required>
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required>
        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="">Selecione</option>
          <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Como quero ajudar</legend>
        <input type="radio" id="doacao" name="interesse" value="doacao" required>
        <label for="doacao">Doação</label>
        <input type="radio" id="voluntariado" name="interesse" value="voluntariado">
        <label for="voluntariado">Voluntariado</label>
        <input type="radio" id="ambos" name="interesse" value="ambos">
        <label for="ambos">Ambos</label>
      </fieldset>
      <fieldset>
        <legend>Confirmação</legend>
        <input type="checkbox" id="consentimento" name="consentimento" required>
        <label for="consentimento">Autorizo o uso dos meus dados para contato da Semear Futuro.</label>
        <button type="submit">Enviar cadastro</button>
      </fieldset>
    </form>
  </main>
  <footer>
    <p><small>&copy; 2026 Semear Futuro. Todos os direitos reservados.</small></p>
  </footer>
</body>
</html>
